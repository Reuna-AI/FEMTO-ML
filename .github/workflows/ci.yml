name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile-check all Python sources
        run: |
          python -m py_compile $(git ls-files '*.py')
      - name: Install deps (best effort)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

  tests:
    # The compiler's output, built and run on the runner: the conv kernels against
    # their C reference, the shipped YOLO26n against its golden outputs, and small
    # models of other shapes against onnxruntime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnx onnxruntime
      - name: Conv kernels, bit for bit (C reference paths, then the S3 paths emulated)
        run: |
          gcc -O2 -I examples/esp32_yolo26n tools/test_conv_kernels.c examples/esp32_yolo26n/esp_nn_conv_s8_simd.c -lm -o test_conv_ref
          ./test_conv_ref
          gcc -O2 -DESP_NN_S3_EMULATE -I examples/esp32_yolo26n tools/test_conv_kernels.c examples/esp32_yolo26n/esp_nn_conv_s8_simd.c -lm -o test_conv_s3
          ./test_conv_s3
      - name: Depthwise conv kernels, bit for bit (C reference paths, then the S3 rows path emulated)
        run: |
          gcc -O2 -I examples/esp32_yolo26n tools/test_dw_kernels.c examples/esp32_yolo26n/esp_nn_depthwise_conv_s8_simd.c examples/esp32_yolo26n/esp_nn_conv_s8_simd.c -lm -o test_dw_ref
          ./test_dw_ref
          gcc -O2 -DESP_NN_S3_EMULATE -I examples/esp32_yolo26n tools/test_dw_kernels.c examples/esp32_yolo26n/esp_nn_depthwise_conv_s8_simd.c examples/esp32_yolo26n/esp_nn_conv_s8_simd.c -lm -o test_dw_s3
          ./test_dw_s3
      - name: YOLO26n golden outputs (esp32s3 and ansi_int8)
        run: python tools/test_golden.py
      - name: The same, through the S3 paths' loops (ESP_NN_S3_EMULATE)
        run: FEMTO_CFLAGS="-DESP_NN_S3_EMULATE" python tools/test_golden.py
      - name: The same, with multiply-add fusion on (as the board's compiler builds)
        run: FEMTO_CFLAGS="-mfma -ffp-contract=fast" python tools/test_golden.py
      - name: Op cases against onnxruntime
        run: python tools/test_ops.py
      - name: Two models in one program (--prefix), and the int8 input alone
        run: python tools/test_two_models.py
      - name: Scorecard
        run: python tools/femto_bench.py examples/esp32_yolo26n/yolo26n_q.onnx
