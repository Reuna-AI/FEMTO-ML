<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="880" height="420" fill="#f8fafc"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Bug #2 — Quantized Residual Add (the big one)</text>

  <!-- BEFORE -->
  <text x="220" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">BEFORE (buggy)</text>
  <rect x="60" y="80" width="150" height="46" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="135" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">fused SiLU</text>
  <text x="135" y="116" text-anchor="middle" font-size="10" fill="#7f1d1d">int8 out: -65, -124 ...</text>

  <rect x="250" y="80" width="150" height="46" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="325" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">float SiLU</text>
  <text x="325" y="116" text-anchor="middle" font-size="10" fill="#0c4a6e">float out: 1.19, 0.56 ...</text>

  <rect x="150" y="175" width="160" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="230" y="197" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Add (float)</text>
  <text x="230" y="214" text-anchor="middle" font-size="10" fill="#7f1d1d">y = a[i] + b[i]</text>
  <text x="230" y="226" text-anchor="middle" font-size="9" fill="#dc2626">raw int8 + float !!</text>

  <line x1="135" y1="126" x2="200" y2="173" stroke="#dc2626" stroke-width="2" marker-end="url(#arR)"/>
  <line x1="325" y1="126" x2="262" y2="173" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="150" y="270" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="295" text-anchor="middle" font-size="11" fill="#334155">corrupted features</text>
  <line x1="230" y1="231" x2="230" y2="268" stroke="#dc2626" stroke-width="2" marker-end="url(#arR)"/>

  <text x="230" y="345" text-anchor="middle" font-size="11" fill="#7f1d1d" font-style="italic">-65 (a raw int) added to 1.19 (a real value)</text>
  <text x="230" y="362" text-anchor="middle" font-size="11" fill="#7f1d1d" font-style="italic">every residual block in the backbone corrupted</text>

  <!-- divider -->
  <line x1="450" y1="70" x2="450" y2="380" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- AFTER -->
  <text x="670" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">AFTER (fixed)</text>
  <rect x="510" y="80" width="150" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="585" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">fused SiLU</text>
  <text x="585" y="115" text-anchor="middle" font-size="10" fill="#14532d">int8 + q_scale, q_zp</text>
  <text x="585" y="127" text-anchor="middle" font-size="9" fill="#16a34a">now carries quant params</text>

  <rect x="700" y="80" width="150" height="46" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="775" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">float SiLU</text>
  <text x="775" y="116" text-anchor="middle" font-size="10" fill="#0c4a6e">float out</text>

  <rect x="590" y="175" width="180" height="66" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="680" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Add (dequant-aware)</text>
  <text x="680" y="214" text-anchor="middle" font-size="9.5" fill="#14532d">y = (scale*(a[i]-zp))</text>
  <text x="680" y="228" text-anchor="middle" font-size="9.5" fill="#14532d">+ b[i]</text>

  <line x1="585" y1="132" x2="645" y2="173" stroke="#16a34a" stroke-width="2" marker-end="url(#arG)"/>
  <line x1="775" y1="126" x2="712" y2="173" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="590" y="280" width="180" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="680" y="305" text-anchor="middle" font-size="11" fill="#334155">correct features</text>
  <line x1="680" y1="241" x2="680" y2="278" stroke="#16a34a" stroke-width="2" marker-end="url(#arG)"/>

  <text x="680" y="355" text-anchor="middle" font-size="11" fill="#14532d" font-style="italic">int8 dequantized before adding to float</text>
  <text x="680" y="372" text-anchor="middle" font-size="10" fill="#64748b">fix: fuse.py attaches q_scale/q_zp; 8 boundaries repaired</text>
</svg>
