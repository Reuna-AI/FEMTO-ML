<svg viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="880" height="400" fill="#f8fafc"/>

  <!-- LEFT: hybrid arena -->
  <text x="220" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Hybrid SRAM / PSRAM Arena</text>
  <text x="220" y="50" text-anchor="middle" font-size="10" fill="#64748b">(gen_activations.py — for esp32s2/s3)</text>

  <!-- SRAM box -->
  <rect x="40" y="70" width="160" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Internal SRAM (fast)</text>
  <text x="120" y="105" text-anchor="middle" font-size="9" fill="#14532d">budget: SRAM_BUDGET_BYTES</text>
  <rect x="55" y="115" width="130" height="24" rx="4" fill="#86efac" stroke="#16a34a"/><text x="120" y="131" text-anchor="middle" font-size="10" fill="#14532d">hot union (most-accessed)</text>
  <rect x="55" y="143" width="130" height="24" rx="4" fill="#86efac" stroke="#16a34a"/><text x="120" y="159" text-anchor="middle" font-size="10" fill="#14532d">hot union</text>
  <rect x="55" y="171" width="130" height="22" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-dasharray="3 2"/><text x="120" y="186" text-anchor="middle" font-size="9" fill="#14532d">...until budget full</text>

  <!-- PSRAM box -->
  <rect x="240" y="70" width="160" height="130" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="320" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">PSRAM (large, slower)</text>
  <text x="320" y="105" text-anchor="middle" font-size="9" fill="#0c4a6e">spill / oversized / standalone</text>
  <rect x="255" y="115" width="130" height="22" rx="4" fill="#bae6fd" stroke="#0284c7"/><text x="320" y="130" text-anchor="middle" font-size="9" fill="#0c4a6e">overflow unions</text>
  <rect x="255" y="141" width="130" height="22" rx="4" fill="#bae6fd" stroke="#0284c7"/><text x="320" y="156" text-anchor="middle" font-size="9" fill="#0c4a6e">big standalone (output)</text>
  <rect x="255" y="167" width="130" height="26" rx="4" fill="#bae6fd" stroke="#0284c7"/><text x="320" y="183" text-anchor="middle" font-size="9" fill="#0c4a6e">runtime fallback if SRAM full</text>

  <text x="220" y="225" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Placement is allocation-time only; kernels &amp; access macros unchanged.</text>

  <!-- divider -->
  <line x1="440" y1="65" x2="440" y2="360" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- RIGHT: compute breakdown -->
  <text x="660" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Where the 8.9s Goes (428M MACs)</text>
  <text x="660" y="50" text-anchor="middle" font-size="10" fill="#64748b">97.8% is convolution — already 99.5% on SIMD</text>

  <!-- stacked bar -->
  <g>
    <rect x="480" y="75" width="360" height="40" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="480" y="75" width="352" height="40" fill="#6366f1"/>
    <text x="656" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Convolutions 97.8%</text>
    <rect x="832" y="75" width="8" height="40" fill="#f59e0b"/>
  </g>
  <text x="480" y="132" font-size="10" fill="#475569">TopK 1.7% &#8226; MatMul 0.4% &#8226; depthwise 0.5% &#8226; all else &lt;0.2%</text>

  <!-- resolution lever -->
  <text x="660" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">The only real speed lever: input resolution</text>
  <g font-size="11">
    <rect x="480" y="185" width="300" height="22" fill="#c7d2fe" stroke="#6366f1"/><text x="490" y="201" fill="#3730a3">256&#215;256</text><text x="770" y="201" text-anchor="end" fill="#3730a3">8.9s</text>
    <rect x="480" y="211" width="225" height="22" fill="#a5b4fc" stroke="#6366f1"/><text x="490" y="227" fill="#3730a3">224&#215;224</text><text x="695" y="227" text-anchor="end" fill="#3730a3">6.6s</text>
    <rect x="480" y="237" width="162" height="22" fill="#818cf8" stroke="#6366f1"/><text x="490" y="253" fill="#fff">192&#215;192</text><text x="632" y="253" text-anchor="end" fill="#fff">4.8s</text>
    <rect x="480" y="263" width="112" height="22" fill="#6366f1" stroke="#4f46e5"/><text x="490" y="279" fill="#fff">160&#215;160</text><text x="582" y="279" text-anchor="end" fill="#fff">3.3s</text>
    <rect x="480" y="289" width="74" height="22" fill="#4f46e5" stroke="#4338ca"/><text x="490" y="305" fill="#fff">128</text><text x="544" y="305" text-anchor="end" fill="#fff">2.2s</text>
  </g>
  <text x="660" y="335" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">A model re-export, not a compiler change. Op-level tricks give ~1% (noise).</text>
</svg>
